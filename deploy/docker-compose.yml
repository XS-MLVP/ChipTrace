name: chiptrace-m0

services:
  m0:
    build:
      context: ..
      args:
        CHIPTRACE_VERSION: ${CHIPTRACE_VERSION:-0.6.0}
        CHIPTRACE_REVISION: ${CHIPTRACE_REVISION:-unknown}
    image: ${CHIPTRACE_IMAGE:-chiptrace:m0-local}
    init: true
    command: ["self-test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
