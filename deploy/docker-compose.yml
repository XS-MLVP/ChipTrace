name: chiptrace-m0

services:
  m0:
    build:
      context: ..
    image: chiptrace:m0-local
    init: true
    command: ["self-test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
