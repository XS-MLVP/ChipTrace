name: ${TRACE_PIPELINE_PROJECT_NAME:-trace-training-pipeline-canary}

services:
  trace-collector-canary:
    profiles: ["canary"]
    build:
      context: ..
    image: ${TRACE_PIPELINE_IMAGE:-trace-training-pipeline:canary}
    container_name: ${TRACE_COLLECTOR_CONTAINER_NAME:-trace-training-pipeline-canary}
    restart: unless-stopped
    user: "${TRACE_PIPELINE_UID:-1000}:${TRACE_PIPELINE_GID:-1000}"
    command:
      - serve
      - --root
      - /data/capture
      - --state-root
      - /data/state
      - --host
      - 0.0.0.0
      - --port
      - "3010"
      - --segment-max-mib
      - "512"
      - --max-envelope-mib
      - "1024"
      - --max-inflight-body-mib
      - "4096"
      - --queue-max-items
      - "2048"
      - --batch-records
      - "64"
      - --batch-wait-ms
      - "25"
    ports:
      - "${TRACE_COLLECTOR_BIND:-127.0.0.1}:${TRACE_COLLECTOR_PORT:-3011}:3010"
    volumes:
      - ${TRACE_CAPTURE_DATA_ROOT:?set TRACE_CAPTURE_DATA_ROOT}:/data/capture
      - ${TRACE_CAPTURE_STATE_ROOT:?set TRACE_CAPTURE_STATE_ROOT}:/data/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; j=json.load(urllib.request.urlopen('http://127.0.0.1:3010/health',timeout=3)); raise SystemExit(0 if j.get('ok') else 1)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - capture-net

networks:
  capture-net:
    name: ${TRACE_COLLECTOR_NETWORK:-trace-pipeline-net}
    external: true
