openapi: 3.1.0
info:
  title: 芯迹（ChipTrace）采集 API
  version: 0.4.0
  description: 万总一芯团队芯片行业 Trace 的本地持久化采集接口。
paths:
  /capture:
    post:
      summary: 持久化一条采集记录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./capture-envelope-v3.schema.json
      responses:
        "202":
          description: 段文件和 ledger 已完成持久化
        "400":
          description: 采集记录格式无效
        "411":
          description: 请求缺少 Content-Length
        "415":
          description: 仅接受 application/json
        "409":
          description: 采集标识被用于不同字节内容
        "413":
          description: 采集记录超过配置的字节上限
        "503":
          description: Collector 背压或存储失败
        "504":
          description: 持久化确认超时，使用相同标识和字节重试
  /health:
    get:
      summary: 读取 Collector 就绪状态和持久化记账状态
      responses:
        "200": {description: Collector 已就绪}
        "503": {description: Collector 未就绪}
  /flush:
    post:
      summary: 按写入顺序持久化并封存当前段
      description: 仅供受信任的本地运维调用；封存后会立即创建新的 open 段。
      responses:
        "200": {description: 当前队列已持久化且段已封存}
        "503": {description: Collector 不可用或队列已满}
        "504": {description: 在途记录未能在超时内完成持久化}
  /audit:
    get:
      summary: 执行有界的 ledger 结构审计
      responses:
        "200": {description: 审计通过}
        "500": {description: 审计失败}
