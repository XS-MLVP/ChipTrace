openapi: 3.1.0
info:
  title: 芯迹云端采集 API
  version: 0.6.0
  description: Stock Codex Wire、OTLP JSON 与 required Hook 的唯一云端采集入口。
paths:
  /models:
    get:
      summary: 返回 Stock Codex 受管模型目录
      description: 18084 验证 Provider 业务凭据后返回只读目录；业务凭据不进入 Relay。
      security:
        - businessBearer: []
      responses:
        "200": {description: 版本化模型能力与 ETag}
        "401": {description: Provider 业务凭据缺失或无效}
        "500": {description: 服务端目录无效}
        "503": {description: Provider 或采集目录暂时不可用}
  /capture:
    post:
      summary: 持久化一条网关 Wire Capture
      description: 仅接收当前 api_snapshot；显式错误版本及其他事实来源返回 400。
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireCapture"
      responses:
        "202":
          description: WAL 与 ledger 已持久化；同时确认当前请求字节和规范化 WAL 记录
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WireReceipt"}
        "200":
          description: 相同 Capture 已持久化；input_receipt 仍绑定本次实际请求字节
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WireReceipt"}
        "400": {description: Capture 无效}
        "401": {description: 内部采集 Token 缺失或无效}
        "409": {description: Capture ID 对应不同字节}
        "413": {description: 请求超过大小上限}
        "503": {description: 背压或存储不可用}
  /captures:
    post:
      summary: 批量持久化网关 Wire Capture
      description: NDJSON 每个非空行必须符合 WireCapture；整批先校验，任一行无效则不写入。
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: {type: string}
      responses:
        "202": {description: 全部记录持久化}
        "200": {description: 全部记录为幂等重放}
        "207": {description: 部分记录失败}
        "400": {description: NDJSON 或 Capture 无效}
        "401": {description: 内部采集 Token 缺失或无效}
        "503": {description: 背压或存储不可用}
  /otel/v1/logs:
    post:
      summary: 持久化 Stock Codex OTLP JSON logs
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Raw envelope 与严格派生事实已持久化}
        "400": {description: OTLP JSON 无效}
        "401": {description: Token 缺失或无效}
        "409": {description: 确定性 Capture ID 冲突}
        "503": {description: 背压或存储不可用}
  /otel/v1/traces:
    post:
      summary: 持久化 Stock Codex OTLP JSON traces
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Raw envelope 已持久化}
        "400": {description: OTLP JSON 无效}
        "401": {description: Token 缺失或无效}
        "503": {description: 背压或存储不可用}
  /hooks/codex:
    post:
      summary: 持久化 Stock Codex 生命周期 Hook
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hook_event_name, session_id]
      responses:
        "200":
          description: Relay WAL 已确认 Hook Raw 与派生事实；不表示 Collector 或 OSS 交付完成。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookReceipt"
        "400": {description: Hook JSON 无效}
        "401": {description: Token 缺失或无效}
        "503": {description: 背压或存储不可用}
  /health:
    get:
      summary: WAL、队列、投递守恒、四路覆盖与成功 Turn Wire 的独立新鲜度
      description: >-
        传输健康不代表 Session 完整。Relay ingest_coverage.wire_turn_coverage
        按 durable ACK 统计有原生 Session/Turn 且无上下文冲突的 Wire、其中 HTTP 2xx
        的数量及无归属/冲突数量；只有非重复的有归属 HTTP 2xx Capture 刷新成功证据时间。
        HTTP 2xx 不证明 SSE 终态。runtime health gate v2 要求该证据近期有效，
        并固定声明 session_delivery_claimed=false。
      responses:
        "200": {description: 就绪}
        "503": {description: 未就绪}
  /flush:
    post:
      summary: 封存当前 WAL Segment
      security:
        - cloudBearer: []
      responses:
        "200": {description: 已完成持久化屏障}
        "401": {description: 内部采集 Token 缺失或无效}
        "503": {description: 封存失败}
components:
  schemas:
    WireReceipt:
      type: object
      required: [ok, durable, local_durable, duplicate, input_receipt, capture]
      properties:
        ok: {type: boolean, const: true}
        durable: {type: boolean, const: true}
        local_durable: {type: boolean, const: true}
        duplicate: {type: boolean}
        input_receipt:
          type: object
          description: 当前 HTTP 请求正文的字节与 SHA-256；与规范化后的 capture 分开确认
          required: [schema_version, bytes, sha256]
          properties:
            schema_version: {type: string, const: chiptrace.capture-input-receipt.v1}
            bytes: {type: integer, minimum: 1}
            sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        capture:
          type: object
          required: [capture_id, state, durable, duplicate, raw_sha256, segment_id, offset, length]
          properties:
            capture_id: {type: string, pattern: "^cap-[A-Za-z0-9._:-]+$"}
            state: {type: string, enum: [accepted, duplicate]}
            durable: {type: boolean, const: true}
            duplicate: {type: boolean}
            raw_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
            segment_id: {type: integer, minimum: 1}
            offset: {type: integer, minimum: 0}
            length: {type: integer, minimum: 1}
    HookReceipt:
      type: object
      required: [partialSuccess, chiptrace]
      properties:
        partialSuccess:
          type: object
          required: [rejectedLogRecords, rejectedSpans, errorMessage]
          properties:
            rejectedLogRecords: {type: integer, const: 0}
            rejectedSpans: {type: integer, const: 0}
            errorMessage: {type: "null"}
        chiptrace:
          type: object
          required: [ok, durable, captures, duplicates, summary]
          properties:
            ok: {type: boolean, const: true}
            durable: {type: boolean, const: true}
            captures: {type: integer, const: 2}
            duplicates: {type: integer, minimum: 0, maximum: 2}
            summary:
              type: object
              required: [endpoint, source_records, derived_captures, unknown_events, attributed_quality_errors, conversion_errors]
              properties:
                endpoint: {type: string, const: codex_hook}
                source_records: {type: integer, const: 1}
                derived_captures: {type: integer, const: 1}
                unknown_events: {type: integer, const: 0}
                attributed_quality_errors: {type: integer, const: 0}
                conversion_errors: {type: array, maxItems: 0}
    WireCapture:
      allOf:
        - $ref: ./capture-v2.schema.json
        - type: object
          required: [recordType, sourceNamespace]
          properties:
            version: {const: chiptrace.capture.v2}
            recordType: {const: api_snapshot}
            sourceNamespace: {type: string, minLength: 1}
          not:
            anyOf:
              - required: [evaluationEvidence]
              - required: [evaluation_evidence]
              - required: [lifecycleEvent]
              - required: [runtimeToolObservation]
              - required: [telemetryBatch]
              - required: [toolExecution]
  securitySchemes:
    businessBearer:
      type: http
      scheme: bearer
      bearerFormat: provider-credential
    cloudBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
