openapi: 3.1.0
info:
  title: 芯迹云端采集 API
  version: 0.6.0
  description: Stock Codex Wire、OTLP JSON 与 required Hook 的唯一云端采集入口。
paths:
  /models:
    get:
      summary: 返回 Stock Codex 受管模型目录
      description: 18084 验证 Provider 业务凭据后返回只读目录；业务凭据不进入 Relay。
      security:
        - businessBearer: []
      responses:
        "200": {description: 版本化模型能力与 ETag}
        "401": {description: Provider 业务凭据缺失或无效}
        "500": {description: 服务端目录无效}
        "503": {description: Provider 或采集目录暂时不可用}
  /capture:
    post:
      summary: 持久化一条网关 Wire Capture
      description: 仅接收当前 api_snapshot；显式错误版本及其他事实来源返回 400。
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WireCapture"
      responses:
        "202": {description: WAL 与 ledger 已持久化}
        "200": {description: 相同 Capture 已持久化}
        "400": {description: Capture 无效}
        "401": {description: 内部采集 Token 缺失或无效}
        "409": {description: Capture ID 对应不同字节}
        "413": {description: 请求超过大小上限}
        "503": {description: 背压或存储不可用}
  /captures:
    post:
      summary: 批量持久化网关 Wire Capture
      description: NDJSON 每个非空行必须符合 WireCapture；整批先校验，任一行无效则不写入。
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: {type: string}
      responses:
        "202": {description: 全部记录持久化}
        "200": {description: 全部记录为幂等重放}
        "207": {description: 部分记录失败}
        "400": {description: NDJSON 或 Capture 无效}
        "401": {description: 内部采集 Token 缺失或无效}
        "503": {description: 背压或存储不可用}
  /otel/v1/logs:
    post:
      summary: 持久化 Stock Codex OTLP JSON logs
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Raw envelope 与严格派生事实已持久化}
        "400": {description: OTLP JSON 无效}
        "401": {description: Token 缺失或无效}
        "409": {description: 确定性 Capture ID 冲突}
        "503": {description: 背压或存储不可用}
  /otel/v1/traces:
    post:
      summary: 持久化 Stock Codex OTLP JSON traces
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: Raw envelope 已持久化}
        "400": {description: OTLP JSON 无效}
        "401": {description: Token 缺失或无效}
        "503": {description: 背压或存储不可用}
  /hooks/codex:
    post:
      summary: 持久化 Stock Codex 生命周期 Hook
      security:
        - cloudBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hook_event_name, session_id]
      responses:
        "200": {description: Hook Raw 与生命周期事实已持久化}
        "400": {description: Hook JSON 无效}
        "401": {description: Token 缺失或无效}
        "503": {description: 背压或存储不可用}
  /health:
    get:
      summary: WAL、队列、投递守恒与当前进程四路采集覆盖
      responses:
        "200": {description: 就绪}
        "503": {description: 未就绪}
  /flush:
    post:
      summary: 封存当前 WAL Segment
      security:
        - cloudBearer: []
      responses:
        "200": {description: 已完成持久化屏障}
        "401": {description: 内部采集 Token 缺失或无效}
        "503": {description: 封存失败}
components:
  schemas:
    WireCapture:
      allOf:
        - $ref: ./capture-v2.schema.json
        - type: object
          required: [recordType, sourceNamespace]
          properties:
            version: {const: chiptrace.capture.v2}
            recordType: {const: api_snapshot}
            sourceNamespace: {type: string, minLength: 1}
          not:
            anyOf:
              - required: [evaluationEvidence]
              - required: [evaluation_evidence]
              - required: [lifecycleEvent]
              - required: [producerEvent]
              - required: [producerModel]
              - required: [rolloutEvent]
              - required: [rolloutMessages]
              - required: [rolloutUsage]
              - required: [runtimeToolObservation]
              - required: [telemetryBatch]
              - required: [toolExecution]
              - required: [toolRegistry]
              - required: [toolRegistrySha256]
  securitySchemes:
    businessBearer:
      type: http
      scheme: bearer
      bearerFormat: provider-credential
    cloudBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
