openapi: 3.1.0
info:
  title: ChipTrace Cloud Platform Adapter
  version: 1.0.0
  description: >-
    Internal service API. The host supplies an explicit project identity and
    storage credentials. A persisted namespace binding prevents the instance
    from reusing another project or storage namespace's jobs and caches.
    End-user authentication and tenant authorization remain the host's responsibility.
servers:
  - url: http://127.0.0.1:18086
security:
  - serviceBearer: []
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: Ready with backend, queued/running/job counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformHealth'}
        '503': {description: Not started, shutting down, or storage/writer lock failure}
  /v1/jobs:
    post:
      description: >-
        Acknowledged only after the job record is persisted. Same ID/request
        is idempotent and returns the same conservative recorded-evidence view
        as GET /v1/jobs/{id}; changed request returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobRequest'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '200': {$ref: '#/components/responses/Job'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    get:
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Total, offset, and bounded job summaries}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/jobs/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      description: >-
        Returns the recorded job with conservative delivery status. For completed
        inspections and exports, missing or contradictory recorded Session,
        source or integrity/acceptance gates override a historical ready flag.
        Export checks include the recorded Buyer v7 counts/pairing, OTLP
        root/parent counts, positive Raw counts and minimum score of 90–100.
        The returned validation_status is not_ready for inspections or fail for
        exports; stored job bytes and nested evidence remain unchanged. Submit
        a new job to recheck the archive. This is not a fresh acceptance run.
      responses:
        '200': {$ref: '#/components/responses/Job'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/jobs/{id}/turns:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      description: >-
        Reads the verified Turn JSONL sidecar. Top-level delivery_ready is the
        overall inspection/acceptance status, including source context audit.
        Summary is the scoped Session view and excludes full turns; total is
        the native Turn count. The overall flag applies the same conservative
        recorded-evidence checks as the job query. Missing or contradictory
        evidence returns false without rewriting historical files; a new job
        is required to recheck the archive. Buyer downloads independently run
        full acceptance verification.
        Before sending headers, a streaming CLI validates every JSONL record
        and all UTF-8 bytes and returns selected byte ranges. The server
        verifies the complete recorded digest and count on the file handle
        used to stream the rows. Response JSON keeps the same fields and full
        selected Turn values without materializing them on the server. SDK
        streamTurns returns a streaming Response; getTurns parses it on the
        client. A page's Turn count does not bound its byte size. Each request
        still scans the full sidecar and holds a read slot until close.
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: 'Object containing delivery_ready, summary, total, offset and turns (at most limit entries)'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/jobs/{id}/turns.jsonl:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      description: >-
        Streams the complete recorded Turn sidecar for a completed inspection
        or export job. Checks size, SHA-256 and record count before sending
        headers, then streams from the same open regular file. A successful
        download verifies artifact bytes, not overall Session delivery status;
        consult the job's delivery_ready and source audit.
      responses:
        '200':
          description: Verified Turn JSONL bytes without buffering full rows
          headers:
            Content-Length:
              schema: {type: integer, minimum: 0}
            X-Content-SHA256:
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            ETag:
              schema: {type: string}
          content:
            application/x-ndjson:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/jobs/{id}/projection/{part}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: part
        in: path
        required: true
        schema:
          type: string
          enum: [manifest, interactions, runtime, links]
    get:
      description: >-
        Streams a reverified canonical interaction projection part for a
        completed inspection job. Reads Manifest metadata in a streaming CLI
        process, checks its complete recorded digest and metadata, and checks
        the requested file before streaming from the same open handle. The
        original Manifest and compressed part bytes are returned unchanged.
      responses:
        '200':
          description: Manifest JSON or compressed canonical JSONL projection
          headers:
            X-Content-SHA256:
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {type: object}
            application/zstd:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/usage/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      description: Stores immutable UTF-8 JSONL usage evidence. Authoritative Sub2API fields are checked during export.
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: {type: string, minLength: 1}
      responses:
        '201': {description: Stored; returns id, bytes and duplicate=false}
        '200': {description: Identical bytes already stored; duplicate=true}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v1/jobs/{id}/packages/{file}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - name: file
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Identifier'}
    get:
      description: Streams only a listed, reverified Buyer package from a completed export.
      responses:
        '200':
          description: Verified tar.gz package
          headers:
            X-Content-SHA256:
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
            ETag:
              schema: {type: string}
          content:
            application/gzip:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  schemas:
    PlatformHealth:
      type: object
      required: [ok, version, backend, build, queued, running, active_reads, jobs, failure]
      properties:
        ok: {type: boolean}
        version: {type: string, const: chiptrace.platform.v1}
        backend: {type: string, enum: [fs, oss, s3]}
        build:
          type: object
          required: [revision]
          properties:
            revision: {type: [string, 'null'], pattern: '^[a-f0-9]{40}$'}
        queued: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        active_reads: {type: integer, minimum: 0}
        jobs: {type: integer, minimum: 0}
        failure: {type: [object, 'null']}
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer}
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  responses:
    Job:
      description: Durable job metadata, status, phase and result summary. Completed exports include package hashes. Turn details use the paginated endpoint.
      content:
        application/json:
          schema:
            type: object
            required: [schema_version, request, status, phase, attempt, created_at]
            properties:
              schema_version: {const: chiptrace.platform-job.v1}
              request: {$ref: '#/components/schemas/JobRequest'}
              status: {enum: [queued, running, completed, failed]}
              phase: {type: string}
              attempt: {type: integer, minimum: 0}
              created_at: {type: string}
              result: {type: object}
              error: {type: object, description: Includes actual engine exit_code and signal when observed}
    Error:
      description: Request or service failure
      content:
        application/json:
          schema:
            type: object
            required: [ok, error]
            properties:
              ok: {const: false}
              error:
                type: object
                required: [code, message]
                properties:
                  code: {type: string}
                  message: {type: string}
  schemas:
    Identifier:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$'
    JobRequest:
      type: object
      additionalProperties: false
      required: [id, kind, archive_id]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {enum: [archive, restore, inspect, export]}
        archive_id: {$ref: '#/components/schemas/Identifier'}
        session_id: {$ref: '#/components/schemas/Identifier'}
        release_id: {$ref: '#/components/schemas/Identifier'}
        usage_log_ids:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/Identifier'}
      allOf:
        - if: {properties: {kind: {enum: [inspect, export]}}}
          then: {required: [session_id]}
          else: {not: {required: [session_id]}}
        - if: {properties: {kind: {const: export}}}
          then: {required: [release_id, usage_log_ids]}
          else:
            not:
              anyOf:
                - {required: [release_id]}
                - {required: [usage_log_ids]}
