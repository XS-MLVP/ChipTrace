[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-training-pipeline"
dynamic = ["version"]
description = "面向 Agent 交互轨迹的可靠采集、完整 Session 整理与训练数据标准化交付流水线"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Trace Pipeline Authors"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["agent", "trace", "trajectory", "dataset", "sqlite"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
performance = ["orjson>=3.10", "zstandard>=0.22"]

[project.scripts]
trace-pipeline = "trace_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "trace_pipeline.__version__"}

[tool.setuptools.package-data]
trace_pipeline = ["py.typed"]
"trace_pipeline.specs" = ["*.json", "*.yaml", "*.sql"]
