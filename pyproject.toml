[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "router-v2-trace-training-pipeline"
version = "0.2.0"
description = "Durable capture and complete-session release pipeline for Router V2 trace data"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trace-pipeline = "trace_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
