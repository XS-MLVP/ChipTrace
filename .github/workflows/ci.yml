name: chiptrace-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[performance]'
      - run: make test
      - run: npm test
      - run: python -m chiptrace self-test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: chiptrace --help
      - name: Verify package identity
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          package = distribution("chiptrace")
          scripts = {
              entry.name: entry.value
              for entry in package.entry_points
              if entry.group == "console_scripts"
          }
          assert scripts == {"chiptrace": "chiptrace.cli:main"}, scripts
          PY
