name: chiptrace-ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  stock-managed-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the pinned unmodified client in the runner temporary directory
        run: |
          stock_spec=$(node -p 'require("./integrations/codex/stock-release.json").npm_spec')
          npm install --prefix "$RUNNER_TEMP/chiptrace-stock-client" \
            --ignore-scripts --no-audit --no-fund "$stock_spec"
          docker pull node:22-bookworm-slim
      - name: Verify managed Wire routing against real user and session overrides
        run: |
          set -euo pipefail
          CHIPTRACE_STOCK_CODEX_MODULES="$RUNNER_TEMP/chiptrace-stock-client/node_modules" \
            make managed-route-test | tee stock-managed-route.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stock-managed-route-report
          path: stock-managed-route.tap

  stock-release-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the unmodified stable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/codex
          ref: 83086188ae0614bd882818ff1aa23f3194962012
          path: .ci-stock-source
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install the official release without changing the runner's CLI
        run: |
          stock_spec=$(node -p 'require("./integrations/codex/stock-release.json").npm_spec')
          npm install --prefix "$RUNNER_TEMP/chiptrace-stable-client" \
            --ignore-scripts --no-audit --no-fund "$stock_spec"
      - name: Enable and verify the isolated native sandbox
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bash scripts/ci/check-native-sandbox.sh
      - name: Build the current Collector and Relay
        timeout-minutes: 22
        run: |
          bash scripts/ci/run-producer-check.sh stock-collector-build \
            "$RUNNER_TEMP/stock-collector-build.log" \
            timeout --signal=TERM --kill-after=30s 20m cargo build --locked --bin chiptrace
      - name: Reproduce stable source-context rejection with new native Turns
        timeout-minutes: 7
        env:
          CHIPTRACE_BIN: ${{ github.workspace }}/target/debug/chiptrace
          CHIPTRACE_PROTOCOL_PRODUCER: ${{ runner.temp }}/chiptrace-stable-client/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex
          CHIPTRACE_PROTOCOL_SOURCE: ${{ github.workspace }}/.ci-stock-source
        run: |
          bash scripts/ci/run-producer-check.sh stock-qualification \
            "$RUNNER_TEMP/stock-qualification.log" \
            bash scripts/ci/qualify-stock-release.sh "$RUNNER_TEMP/stock-qualification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stock-release-context-report
          path: |
            ${{ runner.temp }}/stock-collector-build.log
            ${{ runner.temp }}/stock-qualification.log
            ${{ runner.temp }}/stock-qualification/collection.tap
            ${{ runner.temp }}/stock-qualification/qualification.json
            ${{ runner.temp }}/stock-qualification/gate.json

  upstream-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
      CHIPTRACE_PRODUCER_RESOURCE_INTERVAL_SECONDS: "120"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the stable source shared with official release qualification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/codex
          ref: 83086188ae0614bd882818ff1aa23f3194962012
          path: .ci-codex-source
          fetch-depth: 1
      - name: Verify the producer context patches still match the pinned source
        run: |
          set -euo pipefail
          expected_upstream=$(node -p 'require("./integrations/codex/stock-release.json").upstream_commit')
          test "$(git -C .ci-codex-source rev-parse HEAD)" = "$expected_upstream"
          git -C .ci-codex-source apply --check "$GITHUB_WORKSPACE/docs/upstream-sse-context.patch"
          git -C .ci-codex-source apply "$GITHUB_WORKSPACE/docs/upstream-sse-context.patch"
          git -C .ci-codex-source apply --check "$GITHUB_WORKSPACE/docs/upstream-sse-context-test.patch"
          git -C .ci-codex-source apply "$GITHUB_WORKSPACE/docs/upstream-sse-context-test.patch"
          git -C .ci-codex-source apply --check "$GITHUB_WORKSPACE/docs/upstream-session-scope.patch"
          git -C .ci-codex-source apply "$GITHUB_WORKSPACE/docs/upstream-session-scope.patch"
          git -C .ci-codex-source apply --check "$GITHUB_WORKSPACE/docs/upstream-session-scope-extension.patch"
          git -C .ci-codex-source apply "$GITHUB_WORKSPACE/docs/upstream-session-scope-extension.patch"
          git -C .ci-codex-source apply --check "$GITHUB_WORKSPACE/docs/upstream-session-scope-process.patch"
          git -C .ci-codex-source apply "$GITHUB_WORKSPACE/docs/upstream-session-scope-process.patch"
          git -C .ci-codex-source apply --check "$GITHUB_WORKSPACE/docs/upstream-config-read-scope.patch"
          git -C .ci-codex-source apply "$GITHUB_WORKSPACE/docs/upstream-config-read-scope.patch"
          git -C .ci-codex-source diff --check
      - name: Enable the pinned producer's unprivileged Linux sandbox on the isolated runner
        run: |
          set -euo pipefail
          # Match the pinned producer's .github/actions/setup-ci/action.yml.
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the system Bubblewrap required by the debug producer sandbox
        run: |
          bash scripts/ci/run-producer-check.sh sandbox-install \
            "$RUNNER_TEMP/producer-sandbox-install.log" \
            bash -c 'sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap'
      - name: Prove the real Bubblewrap sandbox can execute with a read-only root
        run: |
          bash scripts/ci/run-producer-check.sh sandbox \
            "$RUNNER_TEMP/producer-sandbox.log" \
            bash scripts/ci/check-native-sandbox.sh
      - name: Reconcile only the pinned tag's local package release versions
        working-directory: .ci-codex-source/codex-rs
        run: |
          producer_version=$(node -p 'require(process.env.GITHUB_WORKSPACE + "/integrations/codex/stock-release.json").version')
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/producer-metadata.json"
          node "$GITHUB_WORKSPACE/scripts/ci/check-producer-lock.js" --prepare \
            "$GITHUB_WORKSPACE/.ci-codex-source" "$RUNNER_TEMP/producer-metadata.json" \
            "$producer_version" | tee "$RUNNER_TEMP/producer-lock-check.json"
      - name: Identify the complete patched producer source before restoring artifacts
        id: producer-source
        run: |
          node scripts/ci/producer-source-cache.js .ci-codex-source \
            | tee "$RUNNER_TEMP/producer-cache-identity.json"
          digest=$(node -p 'require(process.argv[1]).source_sha256' "$RUNNER_TEMP/producer-cache-identity.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        id: producer-cache
        with:
          workspaces: |
            .ci-codex-source/codex-rs -> target
            . -> target
          prefix-key: upstream-context-workspace-v1
          # The key is also in rust-cache's fallback prefix. Different source
          # bytes can never receive artifacts with normalized old timestamps.
          key: source-${{ steps.producer-source.outputs.digest }}
          cache-workspace-crates: "true"
          cache-on-failure: "true"
      - name: "Verify source and normalize timestamps (exact cache hit: ${{ steps.producer-cache.outputs.cache-hit }})"
        env:
          PRODUCER_SOURCE_DIGEST: ${{ steps.producer-source.outputs.digest }}
          PRODUCER_CACHE_HIT: ${{ steps.producer-cache.outputs.cache-hit }}
        run: |
          node scripts/ci/producer-source-cache.js --normalize \
            .ci-codex-source "$PRODUCER_SOURCE_DIGEST" \
            | tee "$RUNNER_TEMP/producer-cache-prepared.json"
          node -e 'console.log(JSON.stringify({exact_cache_hit: process.env.PRODUCER_CACHE_HIT === "true"}))' \
            | tee "$RUNNER_TEMP/producer-cache-observation.json"
      - name: Compile the pinned core test executable before running regressions
        working-directory: .ci-codex-source/codex-rs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" core-test-build \
            "$RUNNER_TEMP/producer-core-test-build.log" \
            cargo test -p codex-core --lib --locked --no-run
      - name: Test callbacks after their creation scope ends
        working-directory: .ci-codex-source/codex-rs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" callbacks \
            "$RUNNER_TEMP/producer-callbacks.log" \
            cargo test -p codex-core --lib --locked creation_scope_ends
      - name: Test parallel response terminals and verify all four context regressions executed
        working-directory: .ci-codex-source/codex-rs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" parallel \
            "$RUNNER_TEMP/producer-parallel.log" \
            cargo test -p codex-core --lib --locked parallel_response_terminals_keep_their_creation_spans
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" verify-callbacks \
            "$RUNNER_TEMP/producer-regression-check.json" \
            node "$GITHUB_WORKSPACE/scripts/ci/check-producer-regressions.js" \
            "$RUNNER_TEMP/producer-callbacks.log" "$RUNNER_TEMP/producer-parallel.log"
      - name: Test the pinned producer's complete HTTP and WebSocket client regressions
        working-directory: .ci-codex-source/codex-rs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" client \
            "$RUNNER_TEMP/producer-client.log" \
            cargo test -p codex-core --lib --locked client::tests
      - name: Compile the pinned App Server test executable before running Session regressions
        working-directory: .ci-codex-source/codex-rs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" session-test-build \
            "$RUNNER_TEMP/producer-session-test-build.log" \
            cargo test -p codex-app-server --lib --locked --no-run
      - name: Test Session and Turn scope propagation and verify both tests executed
        working-directory: .ci-codex-source/codex-rs
        env:
          RUST_MIN_STACK: "16777216"
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" session \
            "$RUNNER_TEMP/producer-session.log" \
            cargo test -p codex-app-server --lib --locked message_processor_tracing_tests
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" verify-session \
            "$RUNNER_TEMP/producer-regression-check-with-session.json" \
            node "$GITHUB_WORKSPACE/scripts/ci/check-producer-regressions.js" \
            "$RUNNER_TEMP/producer-callbacks.log" "$RUNNER_TEMP/producer-parallel.log" \
            "$RUNNER_TEMP/producer-session.log"
      - name: Build the patched CLI and debug App Server from the exact producer source
        working-directory: .ci-codex-source/codex-rs
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-producer-check.sh" build \
            "$RUNNER_TEMP/producer-build.log" \
            cargo build -p codex-cli --bin codex -p codex-app-server --bin codex-app-server --locked
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.0"
      - name: Build the current Collector and Relay for newly executed protocol collection
        run: |
          bash scripts/ci/run-producer-check.sh collector-build \
            "$RUNNER_TEMP/producer-collector-build.log" \
            cargo +1.91.0 build --locked --bin chiptrace
      - name: Check out the pinned MinIO source for native Raw storage verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: minio/minio
          ref: 07c3a429bfed433e49018cb0f78a52145d4bedeb
          path: .ci-native-minio-source
      - name: Build the private S3 service used by every native collection scenario
        working-directory: .ci-native-minio-source
        env:
          GOTOOLCHAIN: go1.24.2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "07c3a429bfed433e49018cb0f78a52145d4bedeb"
          go version 2>&1 | tee "$RUNNER_TEMP/native-minio-go-version.log"
          test "$(go env GOVERSION)" = "go1.24.2"
          CGO_ENABLED=0 go build -p 2 -o "$RUNNER_TEMP/chiptrace-native-minio" . \
            2>&1 | tee "$RUNNER_TEMP/native-minio-build.log"
      - name: Collect native Turns through the CLI and verify FS/S3 Buyer, interruption and compaction recovery
        env:
          CHIPTRACE_PROTOCOL_MODE: patched_stock_cli
          CHIPTRACE_PROTOCOL_PRODUCER: ${{ github.workspace }}/.ci-codex-source/codex-rs/target/debug/codex
          CHIPTRACE_PROTOCOL_SOURCE: ${{ github.workspace }}/.ci-codex-source
          CHIPTRACE_PROTOCOL_EXPECTED_SOURCE_DIGEST: ${{ steps.producer-source.outputs.digest }}
          CHIPTRACE_PROTOCOL_MINIO_BINARY: ${{ runner.temp }}/chiptrace-native-minio
          CHIPTRACE_PROTOCOL_REPORT: ${{ runner.temp }}/native-protocol-ci.json
          CHIPTRACE_BUYER_PROTOCOL_REPORT: ${{ runner.temp }}/native-buyer-protocol-ci.json
          CHIPTRACE_INTERRUPTION_REPORT: ${{ runner.temp }}/native-interruption-ci.json
          CHIPTRACE_COMPACTION_REPORT: ${{ runner.temp }}/native-compaction-ci.json
          CHIPTRACE_AUTO_COMPACTION_REPORT: ${{ runner.temp }}/native-auto-compaction-ci.json
        run: |
          set -euo pipefail
          if make protocol-collection-test 2>&1 | tee "$RUNNER_TEMP/native-protocol-ci.tap"; then
            node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          for (const key of ['CHIPTRACE_PROTOCOL_REPORT', 'CHIPTRACE_BUYER_PROTOCOL_REPORT',
            'CHIPTRACE_INTERRUPTION_REPORT', 'CHIPTRACE_COMPACTION_REPORT', 'CHIPTRACE_AUTO_COMPACTION_REPORT']) {
            const report = JSON.parse(fs.readFileSync(process.env[key], 'utf8'));
            assert.equal(report.ok, true);
            assert.equal(report.producer_mode, 'patched_stock_cli');
            const primary = report.platform_evidence;
            assert.equal(primary.backend, 'fs');
            assert.ok(Array.isArray(primary.additional_storage_backends), 'each native report must contain actual private S3 evidence');
            assert.equal(primary.additional_storage_backends.length, 1);
            const s3 = primary.additional_storage_backends[0];
            assert.equal(s3.backend, 's3');
            assert.equal(s3.remote_checkpoint_verified, true);
            assert.equal(s3.remote_segment_objects_verified, report.collector_raw.length);
            assert.equal(s3.raw_bytes, primary.raw_bytes);
            assert.equal(s3.raw_records, primary.raw_records);
            assert.equal(s3.archive_id, primary.archive_id);
            assert.equal(s3.session_id, primary.session_id);
            assert.equal(s3.native_turns, primary.native_turns);
            assert.equal(s3.model_interactions, primary.model_interactions);
            if (primary.accepted_export_verified) {
              assert.ok(primary.downloaded_session_jsonl.length > 0);
              assert.deepEqual(s3.downloaded_session_jsonl, primary.downloaded_session_jsonl);
            }
            assert.equal(s3.real_oss_account, false);
            assert.equal(s3.production_acceptance_claimed, false);
            console.log(JSON.stringify({ report: key, native_turns: s3.native_turns,
              model_interactions: s3.model_interactions, storage_backends: ['fs', 's3'], production_acceptance_claimed: false }));
          }
          NODE
          else
            protocol_status=$?
            node -e 'const fs = require("node:fs"); const lines = fs.readFileSync(process.argv[1], "utf8").split("\n"); const commands = lines.filter(line => line.startsWith("# ::error title=Native protocol collection::")); for (const line of commands) console.log(line.slice(2)); if (commands.length === 0) console.log("::error title=Native protocol collection::The protocol test process failed; inspect native-protocol-ci.tap.")' \
              "$RUNNER_TEMP/native-protocol-ci.tap"
            exit "$protocol_status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: producer-context-report
          path: |
            ${{ runner.temp }}/producer-lock-check.json
            ${{ runner.temp }}/producer-cache-identity.json
            ${{ runner.temp }}/producer-cache-prepared.json
            ${{ runner.temp }}/producer-cache-observation.json
            ${{ runner.temp }}/producer-sandbox-install.log
            ${{ runner.temp }}/producer-sandbox.log
            ${{ runner.temp }}/producer-core-test-build.log
            ${{ runner.temp }}/producer-callbacks.log
            ${{ runner.temp }}/producer-parallel.log
            ${{ runner.temp }}/producer-regression-check.json
            ${{ runner.temp }}/producer-client.log
            ${{ runner.temp }}/producer-session-test-build.log
            ${{ runner.temp }}/producer-session.log
            ${{ runner.temp }}/producer-build.log
            ${{ runner.temp }}/producer-collector-build.log
            ${{ runner.temp }}/native-minio-go-version.log
            ${{ runner.temp }}/native-minio-build.log
            ${{ runner.temp }}/producer-regression-check-with-session.json
            ${{ runner.temp }}/native-protocol-ci.json
            ${{ runner.temp }}/native-buyer-protocol-ci.json
            ${{ runner.temp }}/native-interruption-ci.json
            ${{ runner.temp }}/native-compaction-ci.json
            ${{ runner.temp }}/native-auto-compaction-ci.json
            ${{ runner.temp }}/native-protocol-ci.tap

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build workspace regression executables
        timeout-minutes: 22
        env:
          CHIPTRACE_PRODUCER_RESOURCE_INTERVAL_SECONDS: "60"
        run: |
          bash scripts/ci/run-producer-check.sh workspace-build rust-test-build.log \
            timeout --signal=TERM --kill-after=30s 20m \
            cargo test --workspace --all-targets --locked --no-run
      - name: Verify workspace regressions and exact Collector delivery receipts
        timeout-minutes: 7
        env:
          CHIPTRACE_PRODUCER_RESOURCE_INTERVAL_SECONDS: "60"
        run: |
          bash scripts/ci/run-producer-check.sh workspace-tests rust-tests.log \
            timeout --signal=TERM --kill-after=30s 5m \
            cargo test --workspace --all-targets --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rust-tests-report
          path: |
            rust-test-build.log
            rust-tests.log
      - name: Verify streaming Turn writer, page reader and projection Manifest reader RSS
        run: |
          set -euo pipefail
          node scripts/ci/turn-memory-gate.js --report turn-memory.json 2>&1 | tee turn-memory.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: turn-memory-report
          path: |
            turn-memory.json
            turn-memory.log
      - name: Verify the durable gateway outbox and retain failure diagnostics
        run: |
          set -euo pipefail
          if node --test integrations/openai-gateway/durable-outbox.test.js 2>&1 | tee gateway-outbox.tap; then
            exit 0
          else
            test_status=$?
            node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('gateway-outbox.tap', 'utf8').split('\n');
          const failed = lines.flatMap((line, index) => /^\s*not ok\b/.test(line) ? [index] : []);
          const escape = text => text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          for (const start of failed.slice(0, 8)) {
            const end = lines.findIndex((line, index) => index > start && /^\s*\.\.\.\s*$/.test(line));
            const detail = lines.slice(start, end < 0 ? start + 40 : end + 1).join('\n').slice(0, 6000);
            console.log(`::error title=Gateway outbox regression::${escape(detail)}`);
          }
          if (failed.length === 0) {
            console.log(`::error title=Gateway outbox command failed::${escape(lines.slice(-40).join('\n').slice(-6000))}`);
          }
          NODE
            exit "$test_status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gateway-outbox-report
          path: gateway-outbox.tap
      - name: Build the CLI used by native Hook and platform regressions
        run: cargo build --locked --bin chiptrace
      - name: Verify delivery receipts, tool namespace provenance and exact OTLP Raw
        run: |
          set -euo pipefail
          node --test integrations/openai-gateway/relay-receipt.test.js 2>&1 | tee gateway-receipt.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gateway-receipt-report
          path: gateway-receipt.tap
      - name: Verify native Hook configuration and durable acknowledgements
        run: |
          set -euo pipefail
          node --test integrations/codex/config-contract.test.js integrations/codex/hook-ack.test.js | tee native-hook-ack.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-hook-ack-report
          path: native-hook-ack.tap
      - name: Verify producer lock, regressions and actual Cargo cache invalidation
        run: |
          node --test scripts/ci/upstream-context.test.js scripts/ci/producer-source-cache.test.js \
            scripts/ci/producer-command.test.js \
            | tee producer-ci-regressions.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: producer-ci-regressions-report
          path: producer-ci-regressions.tap
      - run: node --test scripts/ci/native-canary-gate.test.js
      - run: node --test scripts/ci/native-canary-evidence.test.js
      - run: node --test scripts/ci/stock-release-gate.test.js
      - name: Verify runtime delivery and Turn Wire evidence fails closed
        run: |
          set -euo pipefail
          node --test scripts/ci/runtime-health-gate.test.js | tee runtime-health-gate.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-health-gate-report
          path: runtime-health-gate.tap
      - name: Verify real scenario witnesses and emit the patched multi-turn Canary artifact
        run: |
          set -euo pipefail
          node scripts/ci/native-canary-gate.js \
            --report fixtures/native-canary-multiturn-0163-success-report.json \
            --audit fixtures/native-canary-multiturn-0163-success-audit.json \
            --minimum-turns 2 | tee native-canary-gate.json
          python3 -c '
          import json
          result = json.load(open("native-canary-gate.json", encoding="utf-8"))
          assert result["schema_version"] == "chiptrace.native-canary-gate.v2"
          assert result["scenario_evidence_verified"] is True
          assert result["real_upstream"] is True
          assert result["stock_version"] == "0.163.0-alpha.11"
          assert result["producer_mode"] == "patched_stock"
          assert result["unmodified_stock"] is False
          assert result["production_ready"] is False
          assert result["upstream_commit"] == "5425d3e625daa58eea3ad1de27c087eb3b2ffbd3"
          assert len(result["patch_set"]) == 5
          assert result["native_turns"] == 2
          assert result["model_interactions"] == 8
          assert result["tool_execution_records"] == 6
          assert result["selected_audit_records"] == 3621
          assert result["scenario_coverage"] == [
              "delayed_write_stdin", "failed_tool_process", "resume", "second_turn"
          ]
          assert result["source_coverage"]["complete"] is True
          assert result["source_coverage"]["missing_sources"] == []
          assert result["delivery_ready"] is True
          '
      - name: Prove patched evidence cannot satisfy the production Stock Codex gate
        run: |
          set -euo pipefail
          if node scripts/ci/native-canary-gate.js \
            --report fixtures/native-canary-multiturn-0163-success-report.json \
            --audit fixtures/native-canary-multiturn-0163-success-audit.json \
            --minimum-turns 2 --require-unmodified-stock \
            > patched-native-canary-production-gate.log 2>&1; then
            cat patched-native-canary-production-gate.log
            echo "patched canary unexpectedly passed the unmodified producer gate" >&2
            exit 1
          fi
          grep -F "requires an unmodified Stock Codex producer" \
            patched-native-canary-production-gate.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-canary-gate-report
          path: native-canary-gate.json
      - run: cargo run --locked --bin chiptrace -- self-test
      - name: Verify native context gaps, conflicting attributes and read-only diagnostics
        run: |
          set -euo pipefail
          node --test integrations/codex/native-context.test.js 2>&1 | tee native-context.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-context-report
          path: native-context.tap
      - name: Verify streaming Turn pages, inspection/export, native result quality, recovery and OSS protocol
        run: |
          set -euo pipefail
          node --test integrations/cloud-platform/platform.test.js integrations/cloud-platform/storage-oss.test.js 2>&1 | tee platform.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: platform-report
          path: platform.tap
      - name: Verify Relay cloud delivery benchmark path
        run: |
          cargo run --locked --bin chiptrace -- benchmark-http \
            --records 32 --payload-kib 4 --batch-records 8 \
            --concurrency 4 --store-shards 2 --relay \
          | python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result["records"] == 32
          assert result["relay"] is True
          assert result["relay_health"]["delivered"] == 32
          assert result["relay_health"]["conservation_ok"] is True
          '
      - run: cargo build --release --locked --bin chiptrace
      - run: target/release/chiptrace --help
      - name: Verify source auditing does not retain full Session payloads
        run: node scripts/ci/audit-memory-gate.js --report audit-memory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-memory-report
          path: audit-memory.json
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --build-arg CHIPTRACE_REVISION="$GITHUB_SHA" -t chiptrace:ci .
      - run: docker run --rm chiptrace:ci --help
      - name: Verify container JSONL delivery closure
        run: |
          docker run --rm --network none chiptrace:ci self-test | python3 -c '
          import json, os, sys
          result = json.load(sys.stdin)
          assert result["ok"] is True
          assert result["checks"] and all(result["checks"].values())
          assert result["collection"]["build"]["revision"] == os.environ["GITHUB_SHA"]
          assert result["acceptance"]["hard_gate_pass"] is True
          assert result["acceptance"]["score"] == 100
          assert result["collection_submission"]["durable"] is True
          assert result["collection_submission"]["otlp_replay_duplicates"] == 7
          assert result["checks"]["cloud_source_isolation"] is True
          assert result["checks"]["cloud_runtime_evidence"] is True
          assert result["checks"]["cloud_source_coverage"] is True
          assert result["checks"]["turn_source_coverage"] is True
          assert result["checks"]["turn_interaction_coverage"] is True
          turn_interaction = result["interaction"]["metrics"]["turn_interaction"]
          assert turn_interaction["complete"] is True
          assert turn_interaction["model_interactions"] == result["interaction"]["interactions"] == 6
          assert turn_interaction["model_interactions_assigned_to_turn"] == 6
          assert turn_interaction["tool_execution_spans"] == 5
          assert turn_interaction["tool_execution_spans_assigned_to_turn"] == 5
          session_view = result["interaction"]["session_view"]
          assert session_view["schema_version"] == "chiptrace.session-view.v2"
          assert session_view["turn_source_coverage_complete"] is True
          assert session_view["delivery_ready"] is True
          assert session_view["unscoped_source_records"] == {}
          assert session_view["incomplete_turns"] == 0
          assert session_view["open_turns"] == 0
          assert session_view["conflicted_turns"] == 0
          assert session_view["unscoped_turn_records"] == 0
          assert all(turn["source_coverage"]["complete"] for turn in session_view["turns"])
          source_audit = result["cloud_acceptance"]["source_context_audit"]
          assert source_audit["schema_version"] == "chiptrace.source-context-audit.v2"
          assert source_audit["session_id"] == "thread-self-test"
          assert source_audit["unscoped_otlp_records"] == 0
          assert all(counts["unscoped_turn_records"] == 0 and counts["unknown_session_records"] == 0
                     for counts in source_audit["sources"].values())
          assert result["checks"]["cloud_acceptance"] is True
          assert result["cloud_acceptance"]["schema_version"] == "chiptrace.cloud-acceptance.v2"
          assert result["cloud_acceptance_tamper_detected"] is True
          assert result["checks"]["cloud_tool_execution_evidence"] is True
          assert result["acceptance"]["source_capture_count"] == 20
          assert result["assembly"]["capture_schema_versions"] == ["chiptrace.capture.v2"]
          assert result["buyer_package"]["buyer_profile"] == "buyer-v7"
          assert result["buyer_package"]["minimum_score"] >= 90
          assert result["buyer_package"]["eligible_sessions"] == 1
          assert result["buyer_tamper_detected"] is True
          assert result["buyer_publish"]["artifact_kind"] == "buyer_package"
          assert result["buyer_publish_retry"]["idempotent"] is True
          assert result["published_buyer_verify"]["ok"] is True
          '
      - name: Build cloud platform image
        run: docker build --target platform --build-arg CHIPTRACE_REVISION="$GITHUB_SHA" -t chiptrace-platform:ci .
      - name: Verify tool provenance and Raw delivery through container Relay and Collector
        run: |
          set -euo pipefail
          # Keep the outbox's production 5 GiB free-space floor enabled.
          docker run --rm --network none --read-only \
            --memory 1g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=8g,mode=1777 \
            -e CHIPTRACE_BIN=/usr/local/bin/chiptrace \
            -v "$PWD/integrations/openai-gateway:/tests:ro" \
            chiptrace-platform:ci --test /tests/relay-receipt.test.js \
            2>&1 | tee container-ingest-receipt.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-ingest-receipt-report
          path: container-ingest-receipt.tap
      - name: Verify streaming Turn pages and inspection/export refusal under container limits
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only \
            --memory 1g --cpus 2 --pids-limit 256 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:size=1g,mode=1777 \
            -v "$PWD/integrations/cloud-platform:/tests:ro" \
            chiptrace-platform:ci --test /tests/platform.test.js /tests/storage-oss.test.js \
            2>&1 | tee container-platform.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-platform-report
          path: container-platform.tap
      - name: Verify source auditing and Process conflicts in the container
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=128m,mode=1777 \
            -e CHIPTRACE_BIN=/usr/local/bin/chiptrace \
            -v "$PWD/integrations/codex:/tests/codex:ro" \
            -v "$PWD/fixtures:/fixtures:ro" \
            chiptrace-platform:ci --test /tests/codex/native-context.test.js

  storage-s3-minio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AWS_ACCESS_KEY_ID: chiptrace-ci
      AWS_SECRET_ACCESS_KEY: chiptrace-ci-secret
      AWS_EC2_METADATA_DISABLED: "true"
      CHIPTRACE_S3_ENDPOINT: http://127.0.0.1:9000
      GOTOOLCHAIN: go1.24.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check out pinned MinIO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: minio/minio
          ref: 07c3a429bfed433e49018cb0f78a52145d4bedeb
          path: .ci-minio-source
      - name: Select and verify the pinned Go toolchain using the runner's Go bootstrap
        working-directory: .ci-minio-source
        run: |
          go version 2>&1 | tee "$RUNNER_TEMP/chiptrace-go-version.log"
          test "$(go env GOVERSION)" = "go1.24.2"
      - name: Build isolated S3 test service
        working-directory: .ci-minio-source
        run: |
          CGO_ENABLED=0 go build -p 4 -o "$RUNNER_TEMP/chiptrace-minio" . \
            2>&1 | tee "$RUNNER_TEMP/chiptrace-minio-build.log"
      - name: Start isolated S3 service
        run: |
          MINIO_ROOT_USER=chiptrace-ci MINIO_ROOT_PASSWORD=chiptrace-ci-secret \
            "$RUNNER_TEMP/chiptrace-minio" server "$RUNNER_TEMP/chiptrace-minio-data" \
            --address 127.0.0.1:9000 > "$RUNNER_TEMP/chiptrace-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/chiptrace-minio.pid"
      - run: for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0; sleep 2; done; exit 1
      - run: cargo build --locked --bin chiptrace
      - name: Verify multipart S3 archive and disk restoration
        run: node --test integrations/cloud-platform/storage-s3.test.js | tee storage-s3.tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: storage-s3-report
          path: |
            storage-s3.tap
            ${{ runner.temp }}/chiptrace-go-version.log
            ${{ runner.temp }}/chiptrace-minio-build.log
            ${{ runner.temp }}/chiptrace-minio.log
      - name: MinIO diagnostics
        if: failure()
        run: if [ -f "$RUNNER_TEMP/chiptrace-minio.log" ]; then cat "$RUNNER_TEMP/chiptrace-minio.log"; fi
      - name: Stop isolated S3 service
        if: always()
        run: if [ -f "$RUNNER_TEMP/chiptrace-minio.pid" ]; then kill "$(cat "$RUNNER_TEMP/chiptrace-minio.pid")"; fi
